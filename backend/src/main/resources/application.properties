# ---- Default profile uses H2 in-memory DB so the project runs instantly with zero setup ----

# Server Configuration
# Render (and most PaaS platforms) assign the port to listen on via $PORT at
# runtime - default to 8080 for local dev where $PORT isn't set.
server.port=${PORT:8080}

# Application Info
app.name=Quiz Management and Online Assessment Platform
app.version=1.0.0
spring.application.name=quiz-platform

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh.expiration=604800000

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ORIGINS:quiz-management-and-online-assessme-sooty.vercel.app,http://localhost:5173,http://localhost:3000}

# Default Admin Account
app.admin.default-email=${APP_ADMIN_EMAIL:admin@quizplatform.com}
app.admin.default-password=${APP_ADMIN_PASSWORD:Admin@123}

# Logging Configuration
logging.level.com.quizapp=INFO
